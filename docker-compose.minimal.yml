# Minimal stack for constrained hosts (external CKB node required).
# Set CKB_RPC_URL in .env if your node is not reachable at host.docker.internal:8114.
services:
  redis:
    image: redis:7-alpine
    container_name: ckbadger-redis-minimal
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.indexer
    container_name: ckbadger-indexer-minimal
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CKBADGER_DOMAIN_DATA_PATH: /data/ckbadger-store
      CKBADGER_APPEND_ONLY_DATA_PATH: /data/ckbadger-store-append-only
      REDIS_URL: redis://redis:6379
      CKB_RPC_URL: ${CKB_RPC_URL:-http://host.docker.internal:8114}
      TOKEN_LABELS_PATH: /app/token-labels
      RUST_LOG: info
    command:
      - --batch-size
      - '2000'
      - --parallel-fetch-size
      - '16'
      - --pipeline-buffer
      - '4'
      - --bulk-sync-threshold
      - '1000'
    volumes:
      - ckbadger-data:/data
      - ./docs/token-labels:/app/token-labels:ro
      - ./docs/script-name-overrides.json:/app/script-name-overrides.json:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ckbadger-api-minimal
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CKBADGER_DOMAIN_DATA_PATH: /data/ckbadger-store
      CKBADGER_APPEND_ONLY_DATA_PATH: /data/ckbadger-store-append-only
      REDIS_URL: redis://redis:6379
      CKB_RPC_URL: ${CKB_RPC_URL:-http://host.docker.internal:8114}
      RUST_LOG: info
    volumes:
      - ckbadger-data:/data:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ckbadger-frontend-minimal
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      CKBADGER_SERVER_API_URL: http://api:3001/api/v1
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  ckbadger-data:
  redis-data:
