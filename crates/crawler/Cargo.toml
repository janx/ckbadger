[package]
name = "ckbadger-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ckbadger-store = { path = "../ckbadger-store" }
ckbadger-config = { path = "../config" }
ckbadger-common = { path = "../common" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
maxminddb = { workspace = true }
ckb-network = { workspace = true }
ckb-types = { workspace = true }
# Direct tentacle handle: the crawler builds the p2p Service itself so Discovery is
# registered UNCOMPRESSED (matching real CKB nodes' built-in discovery). Pinned to the
# exact version ckb-network 0.119 resolves, so protocol/meta types are identical.
p2p = { package = "tentacle", version = "=0.6.1" }
tokio-yamux = { workspace = true }
tentacle-secio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
