# Error handling
anyhow = { workspace = true }

# CLI
clap = { workspace = true }

# Config
dotenvy = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
