[package]
name = "ckbadger-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rocksdb = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
ckbadger-common = { path = "../common" }
ckb-hash = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
num_cpus = "1.17"
# Only behind `test-store` (never in a release build).
tempfile = { workspace = true, optional = true }

[features]
# Compile the read/write call counters used to prove that a hot path issues one
# batched read instead of N point reads. Always on for this crate's own tests;
# other crates opt in through their dev-dependencies, so it never reaches a
# release build.
read-call-counters = []
# Test stores that own their temporary directory (`open_*_temp`), removed when
# the last handle drops, after the database closed. Always on for this crate's
# own tests; other crates opt in through their dev-dependencies, so neither the
# field nor `tempfile` reaches a release build.
test-store = ["dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
