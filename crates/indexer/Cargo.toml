[package]
name = "ckbadger-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ckbadger_indexer"
path = "src/lib.rs"

[dependencies]
ckbadger-common = { path = "../common" }
ckb-store-reader = { path = "../ckb-store-reader" }
ckbadger-store = { path = "../ckbadger-store" }

# Async runtime
tokio = { workspace = true }

# HTTP client (for CKB RPC + blocking verify checks)
reqwest = { workspace = true, features = ["blocking"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
chrono = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
dashmap = "6.1"
rayon = { workspace = true }
async-trait = { workspace = true }

# Configuration
config = { workspace = true }
dotenvy = { workspace = true }

# CLI
clap = { workspace = true }

# Terminal UI for verify subcommand
indicatif = "0.17"
console = "0.15"

# CKB types
ckb-types = { workspace = true }
ckb-jsonrpc-types = { workspace = true }
ckb-hash = { workspace = true }

# RocksDB for persistent live cell store
rocksdb = { workspace = true }
bincode = { workspace = true }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tokio-test = { workspace = true }
mockall = { workspace = true }
proptest = { workspace = true }
wiremock = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
criterion = "0.5"
