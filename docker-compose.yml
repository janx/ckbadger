# CKB Node Mode Configuration:
#
# Option 1: Internal CKB Node (runs inside Docker)
#   Set in .env:
#     COMPOSE_PROFILES=internal
#     CKB_RPC_URL=http://ckb-node:8114
#
# Option 2: External CKB Node (uses host machine's node)
#   Set in .env:
#     # COMPOSE_PROFILES=        (leave unset or empty)
#     CKB_RPC_URL=http://host.docker.internal:8114  (macOS/Windows)
#     CKB_RPC_URL=http://172.17.0.1:8114            (Linux)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: ckbadger-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ckbadger}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ports:
      - '8123:8123'
      - '9000:9000'
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Init container: ensures database and tables exist on every startup
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.1
    container_name: ckbadger-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./migrations/clickhouse/001_init.sql:/migrations/001_init.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        if clickhouse-client --host clickhouse --query "SELECT 1 FROM system.databases WHERE name = 'ckbadger'" | grep -q 1; then
          echo "Database ckbadger already exists, skipping migration"
        else
          echo "Running migration..."
          clickhouse-client --host clickhouse --multiquery --queries-file /migrations/001_init.sql
        fi
    restart: 'no'

  redis:
    image: redis:7-alpine
    container_name: ckbadger-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  ckb-node:
    image: nervos/ckb:latest
    container_name: ckbadger-ckb-node
    profiles:
      - internal
    volumes:
      - ckb-data:/var/lib/ckb
    ports:
      - '8114:8114'
      - '8115:8115'
    command: run --indexer
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8114']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.indexer
    container_name: ckbadger-indexer
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Always use Docker-internal URLs for ClickHouse/Redis
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ckbadger}
      REDIS_URL: redis://redis:6379
      CKB_RPC_URL: ${CKB_RPC_URL:-http://ckb-node:8114}
      TOKEN_LABELS_PATH: /app/token-labels
      RUST_LOG: info
    volumes:
      - ./docs/token-labels:/app/token-labels:ro
      - ./docs/script-name-overrides.json:/app/script-name-overrides.json:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ckbadger-api
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Always use Docker-internal URLs for ClickHouse/Redis
      DATABASE_URL: http://clickhouse:8123
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ckbadger}
      REDIS_URL: redis://redis:6379
      CKB_RPC_URL: ${CKB_RPC_URL:-http://ckb-node:8114}
      RUST_LOG: info
    ports:
      - '3001:3001'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ckbadger-frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    restart: unless-stopped

  task-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.task-runner
    container_name: ckbadger-task-runner
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      # Always use Docker-internal URLs for ClickHouse
      DATABASE_URL: http://clickhouse:8123
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ckbadger}
      CKB_RPC_URL: ${CKB_RPC_URL:-http://ckb-node:8114}
      TOKEN_LABELS_PATH: /app/token-labels
      RUST_LOG: info
    volumes:
      - ./docs/token-labels:/app/token-labels:ro
      - ./docs/script-name-overrides.json:/app/script-name-overrides.json:ro
    restart: unless-stopped

volumes:
  clickhouse-data:
  redis-data:
  ckb-data:
