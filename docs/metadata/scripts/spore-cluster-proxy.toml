name = "Spore Cluster Proxy"

# CoBuild actions this type script emits (R-7): `Action.data` is
# spore-contract `action.mol` `union SporeAction` (schema id "spore");
# the Cluster Proxy type uses these items (union item id, table field count).
[cobuild]
schema = "spore"
actions = [
  { id = 5, name = "MintProxy", fields = 3 },
  { id = 6, name = "TransferProxy", fields = 4 },
  { id = 7, name = "BurnProxy", fields = 3 },
]

