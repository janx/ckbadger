name = "Nervape Shadow Lock"
description = "Generic ownership delegate/proxy lock used by Nervape composing flows."

# How this lock's args read (R-8): 33 bytes, the byte `0x01` then a 32-byte
# CKBFS type script hash. Any other first byte has no known meaning and is
# refused.
[lock_args]
fields = [
  { name = "prefix", bytes = 1, equals = "0x01" },
  { name = "ckbfsTypeHash", bytes = 32 },
]

