[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/indexer",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ckbadger contributors"]
license = "MIT"
repository = "https://github.com/nervosnetwork/ckbadger"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid", "rust_decimal", "macros", "migrate"] }

# PostgreSQL COPY support
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["derive"] }
deadpool-postgres = "0.14"
byteorder = "1.5"

# Decimal types for NUMERIC
rust_decimal = { version = "1.36", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
blake2b-rs = "0.2"
uuid = { version = "1.11", features = ["v4", "serde"] }
futures = "0.3"
lru = "0.12"
rayon = "1.10"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Testing
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.13"
proptest = "1.5"
fake = { version = "2.10", features = ["derive"] }
http-body-util = "0.1"
async-trait = "0.1"
tempfile = "3.14"

# CKB types
ckb-types = "0.119"
ckb-jsonrpc-types = "0.119"
ckb-hash = "0.119"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
