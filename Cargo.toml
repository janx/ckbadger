[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/config",
    "crates/ckb-store-reader",
    "crates/ckbadger-store",
    "crates/indexer",
    "crates/api",
    "crates/tui",
    "crates/ipc",
    "crates/cli",
    "crates/dob-decoder",
    "crates/bench",
    "crates/crawler",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["ckbadger contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/nervosnetwork/ckbadger"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }

# Decimal types for NUMERIC
rust_decimal = { version = "1.36", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
blake2b-rs = "0.2"
uuid = { version = "1.11", features = ["v4", "serde"] }
futures = "0.3"
lru = "0.12"
rayon = "1.10"
rustc-hash = "2.1"
hashbrown = "0.14.5"

# Configuration
config = "0.14"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Testing
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.13"
proptest = "1.5"
fake = { version = "2.10", features = ["derive"] }
http-body-util = "0.1"
async-trait = "0.1"
tempfile = "3.14"

# CKB types
ckb-types = "0.119"
ckb-jsonrpc-types = "0.119"
ckb-hash = "0.119"

# CKB p2p network (crawler prober)
ckb-network = "0.119"
ckb-app-config = "0.119"
ckb-spawn = "0.119"
# Transitive p2p-stack pins for ckb-network 0.119. This workspace does not commit
# Cargo.lock, so without these a fresh resolve grabs newer tentacle patch releases
# (tokio-yamux 0.3.18) whose `try_recv` usage was removed in current futures 0.3.x and
# fails to compile. These are the versions CKB v0.119.0 itself locks. Referenced (unused)
# by ckbadger-crawler solely to constrain resolution; only ckb-network consumes them.
tokio-yamux = "=0.3.8"
tentacle-secio = "=0.6.2"

# System
libc = "0.2"
jemalloc-ctl = { package = "tikv-jemalloc-ctl", version = "0.5.0" }
tikv-jemallocator = { version = "0.5.0", features = [
    "unprefixed_malloc_on_supported_platforms",
] }

# Embedded KV store
rocksdb = "0.24"
ckb-vm = { version = "0.24", features = ["asm"] }
bincode = "1.3"

# Asset embedding
rust-embed = "8"
mime_guess = "2"

# GeoIP (network crawler)
maxminddb = "0.24"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
