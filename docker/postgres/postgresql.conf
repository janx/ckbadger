# PostgreSQL Configuration for ckbadger
# Optimized for: 61GB available (93GB total - 32GB system reserved), NVMe SSD, 24-core CPU

# =============================================================================
# EXTENSIONS (must be first)
# =============================================================================
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# =============================================================================
# CONNECTIONS
# =============================================================================
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# =============================================================================
# MEMORY
# =============================================================================
# 25% of available RAM (61GB) for shared buffers
shared_buffers = 16GB

# Per-operation memory (sorts, hashes, etc.)
# 512MB × 200 connections = 100GB potential; 64MB is sufficient for cursor-based pagination
work_mem = 64MB

# Maintenance operations (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 4GB

# Maximum memory for prepared transactions
max_prepared_transactions = 0

# =============================================================================
# WAL (Write-Ahead Logging)
# =============================================================================
# WAL settings for bulk inserts during sync
wal_buffers = 256MB
min_wal_size = 2GB
max_wal_size = 4GB

# Compress WAL using LZ4 - reduces WAL volume by 30-50% for COPY-heavy workloads
# Full-page images and binary data (bytea columns) compress very well
# CPU overhead is negligible with LZ4
wal_compression = lz4

# Disable full-page writes to eliminate 8KB page images after each checkpoint
# Reduces WAL generation by an additional 40-60% for bulk COPY workloads
# Tradeoff: crash may corrupt data pages, but ckbadger data is re-syncable
# Combined with wal_compression, reduces WAL from ~33GB to ~7-10GB per checkpoint cycle
full_page_writes = off

# Checkpoint settings for batch writes
# History:
#   2026-01-28: 30min/32GB → 60min/64GB to reduce frequency (7.7min checkpoints)
#   2026-02-05: Added wal_compression+full_page_writes=off to reduce WAL volume
#   2026-02-05: 60min/64GB → 15min/8GB — DISPROVEN (WAL fills too fast, forced checkpoints)
#   2026-02-05: 15min/8GB → 30min/64GB — spread I/O but caused 211GB backend writes
#   2026-02-09: 30min/64GB → 5min/4GB — with wal_compression+no FPW, WAL rate is
#     ~1.3GB/min so 4GB triggers checkpoints every ~3min. Frequent small checkpoints
#     prevent dirty page accumulation that forces backend writes. The key difference
#     from the 15min/8GB attempt is smaller max_wal_size (4GB vs 8GB) ensuring
#     checkpoints happen before bgwriter falls behind.
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min

# Async commit for bulk inserts (slight durability tradeoff for 2-3x write speed)
# Safe for initial sync since data can be re-synced from blockchain
synchronous_commit = off

# Batch commits together (10ms window) - reduces fsync overhead
commit_delay = 10000
commit_siblings = 5

# =============================================================================
# QUERY PLANNER
# =============================================================================
# SSD storage - random I/O is fast
random_page_cost = 1.1
effective_io_concurrency = 200

# Available memory for query planning (66% of available RAM = 61GB)
effective_cache_size = 40GB

# Enable partition pruning
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# JIT compilation for complex queries
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# =============================================================================
# PARALLEL QUERY
# =============================================================================
max_worker_processes = 24
max_parallel_workers_per_gather = 8
max_parallel_workers = 24
max_parallel_maintenance_workers = 8
parallel_tuple_cost = 0.01
parallel_setup_cost = 100

# =============================================================================
# BACKGROUND WRITER
# =============================================================================
# Aggressive background writing for bulk insert workloads
# Optimized 2026-02-05: Increased maxpages from 1000 to 4000 (never hits limit)
# Optimized 2026-02-05: Increased multiplier 4→10 for more aggressive lookahead
#   cleaning. Combined with checkpoint_timeout=15min, this keeps dirty page
#   ratio low enough to prevent backend eviction during COPY-heavy workloads.
bgwriter_delay = 10ms
bgwriter_lru_maxpages = 4000
bgwriter_lru_multiplier = 10.0
bgwriter_flush_after = 512kB

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# =============================================================================
# LOGGING
# =============================================================================
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log slow queries (> 1 second)
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# =============================================================================
# STATISTICS
# =============================================================================
# Higher statistics target for better partition pruning
default_statistics_target = 200
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# =============================================================================
# CLIENT CONNECTION DEFAULTS
# =============================================================================
statement_timeout = 300000
lock_timeout = 30000
idle_in_transaction_session_timeout = 60000
