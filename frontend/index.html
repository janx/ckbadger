<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The theme before the first paint: the stored preference (lib/theme.ts keeps the same
         key and rules), light when it says so or when it says "system" and the OS does; dark
         otherwise, the default. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('ckbadger.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (stored === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
            theme = 'light';
        } catch (e) {
          /* no storage: the default */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>CKBadger — Local-first CKB-native Explorer</title>
    <meta
      name="description"
      content="Local-first, agent-friendly Nervos CKB explorer. All you need is a CKB node and the will to run your own stack."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
