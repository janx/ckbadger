services:
  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      CKBADGER_DATA_PATH: /data/ckbadger-store
      REDIS_URL: redis://redis-test:6379
      CKB_RPC_URL: ${CKB_RPC_URL:-https://mainnet.ckbapp.dev}
      CKB_NETWORK: mainnet
      API_PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      redis-test:
        condition: service_healthy
    volumes:
      - test-data:/data/ckbadger-store:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/v1/blocks']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-test:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api-test:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api-test:
        condition: service_healthy

volumes:
  test-data:
