version: '3.8'

services:
  clickhouse-test:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: ckbadger_test
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '18123:8123' # Different port to avoid conflicts with dev instance
      - '19000:9000'
    volumes:
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/clickhouse # Use tmpfs for faster tests

  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      CLICKHOUSE_URL: http://clickhouse-test:8123/ckbadger_test
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DATABASE: ckbadger_test
      REDIS_URL: redis://redis-test:6379
      CKB_RPC_URL: ${CKB_RPC_URL:-https://mainnet.ckbapp.dev}
      CKB_NETWORK: mainnet
      API_PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      clickhouse-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/v1/status/health']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-test:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api-test:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api-test:
        condition: service_healthy
