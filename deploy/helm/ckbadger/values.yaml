replicaCount:
  api: 2
  indexer: 1
  frontend: 2

image:
  api:
    repository: ghcr.io/nervosnetwork/ckbadger-api
    tag: ''
    pullPolicy: IfNotPresent
  indexer:
    repository: ghcr.io/nervosnetwork/ckbadger-indexer
    tag: ''
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/nervosnetwork/ckbadger-frontend
    tag: ''
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  annotations: {}
  name: ''

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

api:
  port: 3001
  rateLimitPerSecond: 100
  rateLimitBurst: 200
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

indexer:
  ckbRpcUrl: 'http://ckb-node:8114'
  batchSize: 100
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

frontend:
  port: 3000
  apiUrl: ''
  wsUrl: ''
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

service:
  type: ClusterIP
  api:
    port: 3001
  frontend:
    port: 3000

ingress:
  enabled: false
  className: 'nginx'
  annotations: {}
  hosts:
    - host: ckbadger.local
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /graphql
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: frontend
  tls: []

postgresql:
  enabled: true
  auth:
    username: ckbadger
    password: ckbadger
    database: ckbadger
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

externalDatabase:
  host: ''
  port: 5432
  user: ckbadger
  password: ''
  database: ckbadger
  existingSecret: ''
  existingSecretPasswordKey: 'password'

externalRedis:
  host: ''
  port: 6379
  existingSecret: ''
  existingSecretPasswordKey: 'password'

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
