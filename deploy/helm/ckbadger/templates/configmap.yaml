apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ckbadger.fullname" . }}-config
  labels:
    {{- include "ckbadger.labels" . | nindent 4 }}
data:
  CKBADGER_DOMAIN_DATA_PATH: "{{ .Values.storage.domainDataPath }}"
  CKBADGER_APPEND_ONLY_DATA_PATH: "{{ .Values.storage.appendOnlyDataPath }}"
  API_PORT: "{{ .Values.api.port }}"
  API_HOST: "0.0.0.0"
  API_RATE_LIMIT: "{{ .Values.api.rateLimitPerSecond }}"
  API_RATE_LIMIT_BURST: "{{ .Values.api.rateLimitBurst }}"
  CKB_RPC_URL: "{{ .Values.indexer.ckbRpcUrl }}"
  INDEXER_BATCH_SIZE: "{{ .Values.indexer.batchSize }}"
  RUST_LOG: "info"
  {{- if .Values.frontend.apiUrl }}
  NEXT_PUBLIC_API_URL: "{{ .Values.frontend.apiUrl }}"
  {{- else }}
  NEXT_PUBLIC_API_URL: "http://{{ include "ckbadger.fullname" . }}-api:{{ .Values.service.api.port }}/api/v1"
  {{- end }}
  {{- if .Values.frontend.wsUrl }}
  NEXT_PUBLIC_WS_URL: "{{ .Values.frontend.wsUrl }}"
  {{- else }}
  NEXT_PUBLIC_WS_URL: "ws://{{ include "ckbadger.fullname" . }}-api:{{ .Values.service.api.port }}/ws"
  {{- end }}
