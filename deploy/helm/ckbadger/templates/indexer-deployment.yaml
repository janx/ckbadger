apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckbadger.fullname" . }}-indexer
  labels:
    {{- include "ckbadger.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  replicas: {{ .Values.replicaCount.indexer }}
  selector:
    matchLabels:
      {{- include "ckbadger.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: indexer
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ckbadger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: indexer
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ckbadger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: indexer
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.indexer.repository }}:{{ .Values.image.indexer.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.indexer.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "ckbadger.fullname" . }}-config
            - secretRef:
                name: {{ include "ckbadger.fullname" . }}-secret
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
